<div class="shell">
  <header class="top">
    <div><div class="eyebrow">ARCHITECTURE / EXECUTION MAP</div><h1>LLM ASIC · 项目依赖图</h1><p class="subtitle">硬件 / ISA / gem5、KMD / UMD、PyTorch / AI 编译器、RTL / FPGA 原型四线并行；gem5 的设备、时序、观测和回放不必等待 ISA。</p></div>
    <div class="top-id"><strong>01 / DAG</strong><span>EDITABLE PROJECT MAP</span></div>

  <div class="bar">

<script>
(() => {
  'use strict';
  const KEY='llm-asic-dag-edit-v5';
  const original=JSON.parse(document.getElementById('dag-data').textContent);
  let nodes=load(), mode='full', selected=null, zoom=.8, layout=null, drag=null;
  const lanes=[
    {id:'hardware',name:'硬件层 / ISA / gem5',sub:'设备 / ISA · C-model · gem5 时序 / 观测'},
    {id:'driver',name:'KMD / UMD 驱动',sub:'用户态 API · 内核 ABI · 模拟设备'},
    {id:'compiler',name:'PyTorch / AI 编译器',sub:'导出图 · 高层 IR · 目标 IR · 命令 DAG'},
    {id:'rtl',name:'RTL / FPGA 原型验证',sub:'RTL 实现 · 板级验证 · ASIC 流片'}
  ];
  const $=id=>document.getElementById(id);
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(Array.isArray(x)&&x.length) return x}catch{}return structuredClone(original)}
  function persist(){localStorage.setItem(KEY,JSON.stringify(nodes))}
  function toast(s){const el=$('toast');el.textContent=s;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),2900)}
  function successors(id){return nodes.filter(n=>n.deps.includes(id))}
  function topo(data){
    const map=new Map(data.map(n=>[n.id,n]));if(map.size!==data.length) throw Error('节点 ID 不得重复');
    for(const n of data){if(!n.id||!/^[A-Za-z][A-Za-z0-9_-]*$/.test(n.id))throw Error('节点 ID 应由字母、数字、下划线组成，并以字母开头');if(!lanes.some(l=>l.id===n.lane))throw Error(n.id+' 的泳道无效');
      for(const id of n.deps){if(!map.has(id))throw Error(n.id+' 的前置节点 '+id+' 不存在');if(id===n.id)throw Error(n.id+' 不能依赖自己');if(n.poc&&!map.get(id).poc)throw Error('POC 节点 '+n.id+' 不能依赖非 POC 节点 '+id)}
    }
    const state=new Map(),level=new Map();
    function visit(id){if(state.get(id)===1)throw Error('存在环：'+id+' 回到了自身的依赖链');if(state.get(id)===2)return level.get(id);
      state.set(id,1);const n=map.get(id);const lv=n.deps.length?1+Math.max(...n.deps.map(visit)):0;state.set(id,2);level.set(id,lv);return lv}
    data.forEach(n=>visit(n.id));return level;
  }
  const nodeW=270,nodeH=86,colW=380,left=90,top=94,rowGap=104;
  function compute(){
    const levels=topo(nodes), maxLevel=Math.max(0,...levels.values());
    const pos=new Map(),levelRects=[];let y=top;
    for(let lv=0;lv<=maxLevel;lv++){
      let slots=1;
      for(const lane of lanes) slots=Math.max(slots,nodes.filter(n=>n.lane===lane.id&&levels.get(n.id)===lv).length);
      const h=56+slots*rowGap;levelRects.push({lv,y,h});
      lanes.forEach((lane,j)=>nodes.filter(n=>n.lane===lane.id&&levels.get(n.id)===lv).forEach((n,i)=>pos.set(n.id,{x:left+j*colW+(n.dx||0),y:y+32+i*rowGap+(n.dy||0),lv})));
      y+=h;
    }
    const width=left+lanes.length*colW+28,height=y+24;
    const laneRects=lanes.map((lane,j)=>({...lane,x:left-30+j*colW,w:colW-16}));
    return {levels,maxLevel,laneRects,levelRects,pos,width,height};
  }
  function render(){
    try{layout=compute()}catch(e){toast(e.message);return}
    const {width,height,laneRects,levelRects,pos}=layout;
    const canvas=$('canvas');canvas.style.width=width+'px';canvas.style.height=height+'px';$('edges').setAttribute('width',width);$('edges').setAttribute('height',height);
    $('frame').style.width=Math.ceil(width*zoom)+'px';$('frame').style.height=Math.ceil(height*zoom)+'px';canvas.style.transform=`scale(${zoom})`;
    $('lanes').innerHTML=laneRects.map((l,i)=>`<div class="lanebg" style="left:${l.x}px;width:${l.w}px;height:${height}px"></div><div class="lane-label" style="left:${l.x+30}px;top:17px"><div class="lane-kicker">0${i+1} / ${esc(l.id)}</div><b>${esc(l.name)}</b><span>${esc(l.sub)}</span></div>`).join('');
    $('stages').innerHTML=levelRects.map(l=>`<div class="stage" style="top:${l.y+9}px">${String(l.lv).padStart(2,'0')} / 依赖层 · 同层任务可并行</div>`).join('');
    const paths=[];
    nodes.forEach(n=>n.deps.forEach(d=>{
      const a=pos.get(d),b=pos.get(n.id);if(!a||!b)return;
      const sameLane=nodes.find(v=>v.id===d)?.lane===n.lane;
      let dpath;
      if(sameLane){
        const x1=a.x+nodeW/2,y1=a.y+nodeH,x2=b.x+nodeW/2,y2=b.y;
        dpath=`M${x1},${y1} C${x1},${y1+32} ${x2},${y2-32} ${x2},${y2}`;
      }else{
        const dir=b.x>a.x?1:-1,x1=a.x+(dir>0?nodeW:0),y1=a.y+nodeH/2;
        const x2=b.x+(dir>0?0:nodeW),y2=b.y+nodeH/2;
        const bend=Math.max(54,Math.min(175,Math.abs(x2-x1)*.42));
        dpath=`M${x1},${y1} C${x1+dir*bend},${y1+16} ${x2-dir*bend},${y2-16} ${x2},${y2}`;
      }
      const src=nodes.find(v=>v.id===d);let cls='edge';if(n.poc&&src.poc)cls+=' poc-edge';if(mode==='poc'&&!(n.poc&&src.poc))cls+=' disabled';
      if(selected){if(selected===n.id||selected===d)cls+=' hot';else cls+=' faded'}
      paths.push(`<path class="${cls}" d="${dpath}" marker-end="url(#${cls.includes('hot')?'hotArrow':cls.includes('poc-edge')?'pocArrow':'arrow'})"/>`)
    }));
    $('edges').innerHTML=`<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#718c96"/></marker><marker id="pocArrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#c89468"/></marker><marker id="hotArrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#ffd39d"/></marker></defs>`+paths.join('');
    const focus=selected?new Set([selected,...(nodes.find(n=>n.id===selected)?.deps||[]),...successors(selected).map(n=>n.id)]):null;
    $('cards').innerHTML=nodes.map(n=>{const p=pos.get(n.id);const cls=['card',n.poc?'poc':'',mode==='poc'&&!n.poc?'dim':'',selected===n.id?'selected':'',focus&&!focus.has(n.id)?'focus-muted':'',focus&&focus.has(n.id)&&selected!==n.id?'related':''].filter(Boolean).join(' ');
      return `<button class="${cls}" data-id="${esc(n.id)}" style="left:${p.x}px;top:${p.y}px" title="${esc(n.detail)}"><span class="card-head"><span class="card-id">${esc(n.id)}</span><span class="card-badge">${n.poc?'POC':'FULL'}</span></span><span class="card-title">${esc(n.title)}</span><span class="card-desc">${esc(n.detail)}</span></button>`}).join('');
    $('cards').querySelectorAll('.card').forEach(el=>{el.addEventListener('click',()=>{if(drag?.moved)return;select(el.dataset.id)});el.addEventListener('pointerdown',startDrag)});
    $('zoomLabel').textContent=Math.round(zoom*100)+'%';$('fullBtn').classList.toggle('active',mode==='full');$('pocBtn').classList.toggle('active',mode==='poc');$('fullBtn').setAttribute('aria-pressed',String(mode==='full'));$('pocBtn').setAttribute('aria-pressed',String(mode==='poc'));
    $('modeNote').innerHTML=mode==='poc'?`POC 范围：<b>${nodes.filter(n=>n.poc).length} 个高亮节点</b>。RTL / FPGA / 整模已灰显；高层 IR 可与硬件、驱动并行。`:`完整视图：<b>${nodes.length} 个节点 / ${nodes.reduce((v,n)=>v+n.deps.length,0)} 条依赖</b>。四列并行；橙色描边为 POC，灰蓝色为后续工程。`;
    inspector();
  }
  function startDrag(e){if(e.button!==0)return;const id=e.currentTarget.dataset.id,n=nodes.find(v=>v.id===id);drag={id,x:e.clientX,y:e.clientY,dx:n.dx||0,dy:n.dy||0,moved:false};e.currentTarget.setPointerCapture(e.pointerId);
    const el=e.currentTarget;const move=ev=>{if(!drag)return;const mx=(ev.clientX-drag.x)/zoom,my=(ev.clientY-drag.y)/zoom;if(Math.hypot(mx,my)<4&&!drag.moved)return;drag.moved=true;el.classList.add('dragging');el.style.left=layout.pos.get(id).x+mx+'px';el.style.top=layout.pos.get(id).y+my+'px'};
    const end=ev=>{el.removeEventListener('pointermove',move);el.removeEventListener('pointerup',end);el.removeEventListener('pointercancel',end);if(drag?.moved){n.dx=Math.round(drag.dx+(ev.clientX-drag.x)/zoom);n.dy=Math.round(drag.dy+(ev.clientY-drag.y)/zoom);persist();selected=id;setTimeout(()=>{drag=null;render()},0)}else drag=null};
    el.addEventListener('pointermove',move);el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end)}
  function select(id){selected=id;render();const p=layout?.pos.get(id),v=$('viewport');if(!p)return;const x=p.x*zoom,y=p.y*zoom;if(x<v.scrollLeft+40||x+nodeW*zoom>v.scrollLeft+v.clientWidth-30||y<v.scrollTop+40||y+nodeH*zoom>v.scrollTop+v.clientHeight-30){v.scrollTo({left:Math.max(0,x-v.clientWidth*.35),top:Math.max(0,y-v.clientHeight*.35),behavior:'smooth'})}}
  function inspector(){
    const n=nodes.find(v=>v.id===selected);$('inspectorTitle').textContent=n?'编辑 '+n.id:'节点编辑器';
    if(!n){$('inspectorBody').innerHTML=`<div class="stats"><div class="stat"><b>${nodes.length}</b><span class="stat-label">节点</span></div><div class="stat"><b>${nodes.filter(v=>v.poc).length}</b><span class="stat-label">POC</span></div><div class="stat"><b>${nodes.reduce((x,v)=>x+v.deps.length,0)}</b><span class="stat-label">依赖边</span></div></div><div class="empty"><div class="graphic">↗</div><strong>点击任意节点，查看依赖并编辑</strong>上游是开始它之前必须具备的功能；下游是直接依赖它的工作。拖动节点可以微调位置。<br><br>切换到「POC 高亮」，非 POC 的节点与连线只会灰掉，不会被删除。</div><div class="footnote">本图 POC 包含抽象原语 C-model、gem5 时序 / 访存观测、ISA/驱动接入及编译器小图与规划反馈验证。<b>RTL / FPGA 与完整模型端到端推理均不属于 POC。</b><br><br>编辑自动保存在此浏览器；点击「导出当前 HTML」可将修改写进可移交的单文件。</div>`;return}
    const up=n.deps,down=successors(n.id).map(v=>v.id);
    $('inspectorBody').innerHTML=`<div class="stats"><div class="stat"><b>${String(layout.levels.get(n.id)).padStart(2,'0')}</b><span class="stat-label">依赖层</span></div><div class="stat"><b>${up.length}</b><span class="stat-label">直接前置</span></div><div class="stat"><b>${down.length}</b><span class="stat-label">直接后置</span></div></div>
      <div class="field"><span class="field-label">节点 ID</span><input class="input" id="editId" value="${esc(n.id)}" ><div class="smallhelp">修改 ID 会同步更新所有引用此节点的依赖。</div></div>
      <div class="field"><span class="field-label">节点名称</span><input class="input" id="editTitle" value="${esc(n.title)}"></div>
      <div class="field"><span class="field-label">功能与验收描述</span><textarea class="input" id="editDetail">${esc(n.detail)}</textarea></div>
      <div class="field"><span class="field-label">所在泳道</span><select class="input" id="editLane">${lanes.map(l=>`<option value="${l.id}" ${n.lane===l.id?'selected':''}>${esc(l.name)}</option>`).join('')}</select></div>
      <div class="field"><label class="checkline"><input type="checkbox" id="editPoc" ${n.poc?'checked':''}><span><b>POC 阶段必须做</b><br>打开后，在 POC 模式高亮；不能依赖灰色节点。</span></label></div>
      <div class="field"><span class="field-label">前置依赖 ID（逗号分隔）</span><input class="input" id="editDeps" value="${esc(up.join(', '))}"><div class="smallhelp">保存时检查：引用存在、无环、POC 范围依赖闭合。</div></div>
      <div class="field"><span class="field-label">直接前置</span><div class="dep-list">${up.length?up.map(id=>`<button class="dep" data-jump="${esc(id)}">← ${esc(id)}</button>`).join(''):'<span class="dep none">无</span>'}</div></div>
      <div class="field"><span class="field-label">直接后置</span><div class="dep-list">${down.length?down.map(id=>`<button class="dep" data-jump="${esc(id)}">${esc(id)} →</button>`).join(''):'<span class="dep none">无</span>'}</div></div>
      <div id="formError" class="error" role="alert"></div><div class="form-actions"><button class="tool primary" id="saveNode">保存修改</button><button class="tool danger" id="deleteNode">删除节点</button></div>
      <div class="footnote">四列代表并行工作流，纵向依赖层由前置关系自动计算。拖动卡片可微调位置。</div>`;
    $('saveNode').onclick=saveNode;$('deleteNode').onclick=deleteNode;$('inspectorBody').querySelectorAll('[data-jump]').forEach(el=>el.onclick=()=>select(el.dataset.jump));
  }
  function error(s){const el=$('formError');el.textContent=s;el.classList.add('show')}
  function saveNode(){const old=selected;const newId=$('editId').value.trim();const next=structuredClone(nodes);const row=next.find(n=>n.id===old);row.id=newId;row.title=$('editTitle').value.trim();row.detail=$('editDetail').value.trim();row.lane=$('editLane').value;row.poc=$('editPoc').checked;row.deps=[...new Set($('editDeps').value.split(/[,，\s]+/).map(s=>s.trim()).filter(Boolean))];
    if(!row.title)return error('请填写节点名称');if(!row.detail)return error('请填写功能与验收描述');if(newId!==old)next.forEach(v=>{v.deps=v.deps.map(d=>d===old?newId:d)});
    try{topo(next)}catch(e){return error(e.message)}nodes=next;selected=newId;persist();render();toast('已保存，DAG 无环且 POC 依赖闭合')}
  function deleteNode(){const down=successors(selected);if(down.length)return error('先从后置节点移除对 '+selected+' 的依赖：'+down.map(n=>n.id).join('、'));
    if(!confirm('确定删除节点 '+selected+'？'))return;nodes=nodes.filter(n=>n.id!==selected);selected=null;persist();render();toast('节点已删除')}
  function fit(){const v=$('viewport');if(!layout)return;zoom=Math.max(.16,Math.min(1.1,(v.clientWidth-30)/layout.width));render();v.scrollTo({left:0,top:0})}
  function exportHtml(){const clone=document.documentElement.cloneNode(true);clone.querySelector('#dag-data').textContent='\n'+JSON.stringify(nodes,null,2).replace(/</g,'\\u003c')+'\n';clone.querySelector('#cards').innerHTML='';clone.querySelector('#lanes').innerHTML='';clone.querySelector('#stages').innerHTML='';clone.querySelector('#edges').innerHTML='';clone.querySelector('#inspectorBody').innerHTML='';clone.querySelectorAll('script')[1].textContent=clone.querySelectorAll('script')[1].textContent.replace("llm-asic-dag-edit-v5",'llm-asic-dag-export-'+Date.now());const html='<!doctype html>\n'+clone.outerHTML;const blob=new Blob([html],{type:'text/html;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='llm_asic_project_dag_edited.html';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000);toast('已导出可独立打开的 HTML')}
  $('fullBtn').onclick=()=>{mode='full';render()};$('pocBtn').onclick=()=>{mode='poc';selected=null;render()};$('fitBtn').onclick=fit;
  $('zoomIn').onclick=()=>{zoom=Math.min(1.6,Math.round((zoom+.1)*10)/10);render()};$('zoomOut').onclick=()=>{zoom=Math.max(.3,Math.round((zoom-.1)*10)/10);render()};
  $('exportBtn').onclick=exportHtml;
  $('addBtn').onclick=()=>{const id='N'+(1+Math.max(0,...nodes.filter(n=>/^N\d+$/.test(n.id)).map(n=>Number(n.id.slice(1)))));const lane=nodes.find(n=>n.id===selected)?.lane||'hardware';const candidate={id,title:'新节点',detail:'双击右侧字段编辑功能和验收方式',lane,poc:false,deps:selected?[selected]:[]};nodes.push(candidate);selected=id;persist();render();toast('已添加 '+id+'，请编辑名称与依赖')};
  $('viewport').addEventListener('wheel',e=>{if(!e.ctrlKey&&!e.metaKey)return;e.preventDefault();zoom=Math.min(1.6,Math.max(.3,zoom+(e.deltaY<0?.1:-.1)));render()},{passive:false});
  window.addEventListener('keydown',e=>{if(e.key==='Escape'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)){selected=null;render()}});
  try{topo(nodes)}catch(e){nodes=structuredClone(original);localStorage.removeItem(KEY)}
  if(location.hash==='#poc')mode='poc';
  render();fit();
})();
</script>
</body>
</html>
